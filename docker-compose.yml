services:
  clarity365:
    build: .
    container_name: clarity365-suite
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - clarity365-data:/app/data
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - HOST=127.0.0.1
      - PORT=3000
      - CLARITY365_DATABASE_PATH=/app/data/clarity365.db
    restart: unless-stopped

volumes:
  clarity365-data:
    driver: local

